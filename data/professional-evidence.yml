provenance: User-directed professional portfolio URL; use as a fit signal and review before reusing claims in application materials.
calculus:
  description: Evidence coverage is a transparent profile-to-role signal, not a candidate percentile or hiring probability.
  weights:
    triage: 0.6
    portfolio_evidence: 0.4
evidence:
